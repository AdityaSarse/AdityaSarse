<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 230" width="830" height="230">
<defs>
<linearGradient id="qb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#faf5ff"/><stop offset=".5" stop-color="#fdf2f8"/><stop offset="1" stop-color="#ecfeff"/></linearGradient>
<linearGradient id="qs" x1="0" x2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset=".5" stop-color="#ec4899"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
<clipPath id="qc"><rect width="830" height="230" rx="22"/></clipPath>
</defs>
<style>
.qm{animation:fl 5s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-8px)}}
.l1{animation:in 1s .2s ease-out both}.l2{animation:in 1s .9s ease-out both}.at{animation:in 1s 1.6s ease-out both}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.ul{stroke-dasharray:120;stroke-dashoffset:120;animation:dr 1.4s 1.9s ease-out forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.dot{animation:pu 3s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}
</style>
<g clip-path="url(#qc)">
<rect width="830" height="230" fill="url(#qb)"/>
<circle class="dot" cx="760" cy="40" r="70" fill="#c4b5fd" opacity=".35"/>
<circle class="dot" cx="60" cy="200" r="80" fill="#a5f3fc" opacity=".4" style="animation-delay:-1.5s"/>
</g>
<rect x="1.5" y="1.5" width="827" height="227" rx="21" fill="none" stroke="url(#qs)" stroke-width="3"/>
<text class="qm" x="38" y="112" font-family="Georgia,'Times New Roman',serif" font-size="120" font-weight="700" fill="url(#qs)" opacity=".9">“</text>
<text class="l1" x="415" y="96" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="27" font-style="italic" fill="#3b0764">The best interfaces are the ones you don’t notice —</text>
<text class="l2" x="415" y="136" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="27" font-style="italic" fill="#3b0764">because everything just works.</text>
<g class="at"><text x="790" y="190" text-anchor="end" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="3" fill="#7c3aed">— MY DESIGN MANTRA</text></g>
<path class="ul" d="M640 200 H790" stroke="url(#qs)" stroke-width="3" stroke-linecap="round" fill="none"/>
</svg>